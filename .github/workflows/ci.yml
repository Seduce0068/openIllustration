# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。cargo test 用の
# 環境変数は env_vars、clippy の追加引数は clippy_args で渡す。
# wasm ターゲットの導入は wasm_targets、client の wasm ビルドは
# e2e/ci-e2e.sh の trunk build に一元化する（extra_gates での重複を避ける）。
# cargo-deny の4ゲート（licenses / advisories / bans / sources）と
# E2E（Playwright）は extra_gates で追加する。
# E2E の JWT シークレットは e2e/ci-e2e.sh が実行ごとに生成する。
# Dependabot は外部サービス設定（.github/dependabot.yml）のため本タスクでは追加しない。
# 週次 schedule と cargo deny / npm audit により検出はゲート側で担保する。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # 週次の依存監査（cargo deny check advisories は extra_gates で定期実行）。
  # 既存の push / pull_request / workflow_dispatch トリガは維持する。
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      timeout_minutes: 30
      # シェル静的ゲート（extra_gates）で shellcheck / shfmt を使うため、
      # 共通ワークフローの apt 導入ステップでインストールする。
      apt_packages: shellcheck shfmt gpg
      env_vars: |
        JWT_SECRET=ci_test_secret_for_ci_0123456789abcdef
        ALLOW_MOCK_AUTH=1
        ALLOW_IPV4_LOCALHOST=1
      # 共通ワークフローは -D warnings を先頭に付けるが、ローカル検証ループと
      # 同じ引数を明示する（重複しても無害）。
      clippy_args: "-D warnings -A clippy::module-inception -D clippy::undocumented_unsafe_blocks"
      wasm_targets: wasm32-unknown-unknown
      extra_gates: |
        # dev-console feature 配下（初期化・EXPORT_RESULT）もコンパイル/テストして未検証経路を残さない。
        cargo clippy -p client --all-targets --all-features -- -D warnings -A clippy::module-inception -D clippy::undocumented_unsafe_blocks
        cargo test -p client --all-features --quiet
        npm ci --ignore-scripts --no-fund && npx markdownlint-cli2 "docs/**/*.md" ".amazonq/rules/**/*.md" "todo.md" "README.md" "index.md"
        # npm 監査: ルート / e2e / client の3 lockfile を対象にする。
        # いずれも devDependency で本番ランタイムへは入らない。
        npm audit --audit-level=high
        npm audit --prefix e2e --audit-level=high
        npm audit --prefix client --audit-level=high
        bash scripts/test-doc-numbers.sh
        cargo install cargo-deny --version 0.20.2 --locked
        cargo deny check licenses
        cargo deny check advisories
        cargo deny check bans sources
        bash scripts/test-backup-rotate.sh
        bash scripts/test-backup-cron-wrapper.sh
        bash scripts/test-prepare-distribution.sh
        bash e2e/ci-e2e.sh
        # シェル静的ゲート（既存行は維持し、以下3行を追加）。対象は glob で明示する。
        # shellcheck / shfmt は共通ワークフローの apt_packages（呼び出し側 ci.yml）で導入する。
        for f in scripts/*.sh e2e/*.sh; do bash -n "$f"; done
        # SC2034 は ci-e2e.sh の nameref 関数のみで関数単位の disable コメントとして除外する。
        # SC2016 は test-backup-rotate.sh の systemd 契約検証用リテラルのみで行単位除外する。
        for f in scripts/*.sh e2e/*.sh; do shellcheck "$f"; done
        shfmt_files="$(shfmt -l scripts/*.sh e2e/*.sh)" || exit 1; if [ -n "$shfmt_files" ]; then echo "shfmt: unformatted: $shfmt_files" >&2; exit 1; fi
