# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。cargo test 用の
# 環境変数は env_vars、clippy の追加引数は clippy_args で渡す。
# wasm ターゲットの導入は wasm_targets、client の wasm ビルドは
# e2e/ci-e2e.sh の trunk build に一元化する（extra_gates での重複を避ける）。
# ライセンス検査と E2E（Playwright）は extra_gates で追加する。
# E2E の JWT シークレットは e2e/ci-e2e.sh が実行ごとに生成する。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      timeout_minutes: 30
      env_vars: |
        JWT_SECRET=ci_test_secret_for_ci_0123456789abcdef
        ALLOW_MOCK_AUTH=1
        ALLOW_IPV4_LOCALHOST=1
      # 共通ワークフローは -D warnings を先頭に付けるが、ローカル検証ループと
      # 同じ引数を明示する（重複しても無害）。
      clippy_args: "-D warnings -A clippy::module-inception -D clippy::undocumented_unsafe_blocks"
      wasm_targets: wasm32-unknown-unknown
      extra_gates: |
        npm ci --ignore-scripts --no-audit --no-fund && npx markdownlint-cli2 "docs/**/*.md" "todo.md" "README.md" "index.md"
        bash scripts/test-doc-numbers.sh
        cargo install cargo-deny --version 0.20.2 --locked
        cargo deny check licenses
        cargo deny check advisories
        bash scripts/test-backup-rotate.sh
        bash scripts/test-backup-cron-wrapper.sh
        bash scripts/test-prepare-distribution.sh
        bash e2e/ci-e2e.sh
