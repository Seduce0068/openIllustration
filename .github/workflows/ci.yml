# 個人リポジトリ共通の再利用可能ワークフロー
# （Seduce0068/workflows の rust-gates.yml）へ委譲する。cargo test 用の
# 環境変数は env_vars、clippy の追加引数は clippy_args で渡す。
# wasm ターゲットの導入は wasm_targets、client の wasm ビルドは
# e2e/ci-e2e.sh の trunk build に一元化する（extra_gates での重複を避ける）。
# cargo-deny の4ゲート（licenses / advisories / bans / sources）と
# E2E（Playwright）は extra_gates で追加する。
# E2E の JWT シークレットは e2e/ci-e2e.sh が実行ごとに生成する。
# Dependabot は外部サービス設定（.github/dependabot.yml）のため本タスクでは追加しない。
# 週次 schedule と cargo deny / npm audit により検出はゲート側で担保する。
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # 週次の依存監査（cargo deny check advisories は extra_gates で定期実行）。
  # 既存の push / pull_request / workflow_dispatch トリガは維持する。
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    uses: Seduce0068/workflows/.github/workflows/rust-gates.yml@v1
    with:
      timeout_minutes: 30
      # シェル静的ゲート（extra_gates）で shellcheck / shfmt を使うため、
      # 共通ワークフローの apt 導入ステップでインストールする。
      # systemd: systemd-analyze verify による deploy unit 構文ゲート用。
      # betterleaks は固定版リリース tarball を直接取得するため go は不要（ADR-0013 P3）。
      apt_packages: shellcheck shfmt gpg systemd
      # Chrome 上限: ランナーの Chrome を自動更新した際は検証済み major へ追随させる。
      # 注意: env_vars は $GITHUB_ENV へそのまま書き出されるため KEY=VALUE 行のみ置く（コメント行は job 失敗）。
      env_vars: |
        JWT_SECRET=ci_test_secret_for_ci_0123456789abcdef
        ALLOW_MOCK_AUTH=1
        ALLOW_IPV4_LOCALHOST=1
        MAX_CHROME_MAJOR=140
      # 共通ワークフローは -D warnings を先頭に付けるが、ローカル検証ループと
      # 同じ引数を明示する（重複しても無害）。
      clippy_args: "-D warnings -A clippy::module-inception -D clippy::undocumented_unsafe_blocks"
      wasm_targets: wasm32-unknown-unknown
      extra_gates: |
        # --- ADR-0013 P3: CI バイナリキャッシュ -------------------------------
        # cargo-deny 0.20.2 / betterleaks v1.10.1 をバージョン＋checksum 付きで
        # $HOME/.cache/oil-ci-tools に配置する。現状は actions/cache が接続されていない
        # ため毎回コールドインストールとなり、ヒット判定は常に 0 となる。
        # 保存先は共通ワークフロー rust-gates.yml 側の cache-directories 入力を待つ
        # （追加された場合はキーに tool 名＋固定バージョン＋checksum を使う）。
        # いずれの場合も sha256sum -c と固定版 --version を再確認して fail-closed にし、
        # 検証失敗時は exit 1（旧 go install フォールバックは版ゲートを通れないため廃止）。
        tool_cache_dir="${HOME}/.cache/oil-ci-tools"
        mkdir -p "$tool_cache_dir"
        cargo_deny_version="0.20.2"
        betterleaks_version="v1.10.1"
        # dev-console feature 配下（初期化・EXPORT_RESULT）もコンパイル/テストして未検証経路を残さない。
        cargo clippy -p client --all-targets --all-features -- -D warnings -A clippy::module-inception -D clippy::undocumented_unsafe_blocks
        cargo test -p client --all-features --quiet
        # wasm が実際に使う checksum-only 構成も別途検証する（feature ドリフト防止）。
        cargo test -p common --no-default-features --features checksum --quiet
        # wasm 専用 cfg 分岐（format_stats_generated_at / public_stats_is_stale 等）も lint 対象にする。
        cargo clippy -p client --target wasm32-unknown-unknown --all-features -- -D warnings -A clippy::module-inception -D clippy::undocumented_unsafe_blocks
        # シークレットスキャン（pre-commit 主軸・CI は最終ゲート）。
        # --staged は checkout 直後に index が HEAD と一致し 0 バイト走査になるため、
        # CI では --log-opts でイベント別の範囲を明示して走査する。
        # pull_request は base..head（マルチコミット PR を漏らさない）、push は before..HEAD。
        # ADR-0013 P3: 固定版リリース資産（ldflags 済みバイナリ）を第1経路にする。
        # go install は version.Version="dev" のままとなり --version ゲートを通過できない
        # （CI で実証）ため、リリース tarball + checksums.txt を優先する。
        betterleaks_bin="${tool_cache_dir}/betterleaks-${betterleaks_version}"
        betterleaks_sum="${betterleaks_bin}.sha256"
        betterleaks_hit=0
        if [[ -x "$betterleaks_bin" && -f "$betterleaks_sum" ]] &&
           (cd "$tool_cache_dir" && sha256sum -c "$(basename "$betterleaks_sum")" >/dev/null 2>&1); then
          betterleaks_hit=1
        fi
        if ((betterleaks_hit == 0)); then
          # GoReleaser の amd64 asset 名は linux_x64（linux_amd64 ではない）。
          bl_asset="betterleaks_${betterleaks_version#v}_linux_x64.tar.gz"
          bl_base="https://github.com/betterleaks/betterleaks/releases/download/${betterleaks_version}"
          bl_tmp="$(mktemp -d "${RUNNER_TEMP:-/tmp}/betterleaks.XXXXXX")"
          curl -fsSL -o "${bl_tmp}/${bl_asset}" "${bl_base}/${bl_asset}"
          curl -fsSL -o "${bl_tmp}/checksums.txt" "${bl_base}/checksums.txt"
          bl_sha="$(awk -v asset="$bl_asset" '$2 == asset { print $1 }' "${bl_tmp}/checksums.txt")"
          [[ -n "$bl_sha" ]] || {
            echo "::error::checksum entry not found for ${bl_asset}" >&2
            exit 1
          }
          (cd "$bl_tmp" && printf '%s  %s\n' "$bl_sha" "$bl_asset" | sha256sum -c -)
          tar -xzf "${bl_tmp}/${bl_asset}" -C "$bl_tmp" betterleaks
          cp "${bl_tmp}/betterleaks" "$betterleaks_bin"
          (cd "$tool_cache_dir" && sha256sum "$(basename "$betterleaks_bin")" > "$(basename "$betterleaks_sum")")
        fi
        # キャッシュヒット／ミスを問わず固定版 --version を確認する（ADR-0013 P3）。
        betterleaks_version_output="$("$betterleaks_bin" --version 2>&1)"
        [[ "$betterleaks_version_output" == *"${betterleaks_version#v}"* ]] || {
          echo "::error::betterleaks version mismatch: expected ${betterleaks_version}" >&2
          printf '%s\n' "$betterleaks_version_output" >&2
          exit 1
        }
        ln -sf "$(basename "$betterleaks_bin")" "${tool_cache_dir}/betterleaks"
        export PATH="${tool_cache_dir}:${PATH}"
        echo "betterleaks cache_hit=${betterleaks_hit}"
        command -v betterleaks
        betterleaks --version
        case "${{ github.event_name }}" in
          pull_request)
            scan_range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            ;;
          push)
            # 新規ブランチ初回 push / force push の all-zero before は範囲解決不能なので全履歴へ。
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0{40}$ ]]; then
              scan_range=""
            else
              scan_range="${before}..HEAD"
            fi
            ;;
          *)
            # schedule / workflow_dispatch: 定期再スキャンなので全到達可能履歴を対象にする。
            scan_range=""
            ;;
        esac
        if [[ -n "$scan_range" ]]; then
          betterleaks git . --redact --config .betterleaks.toml --log-opts="$scan_range"
        else
          betterleaks git . --redact --config .betterleaks.toml
        fi
        # markdownlint-cli2 / TypeScript は Node>=22.12 を要求するため、major+minor を検証する。
        node_version="$(node --version)"
        if [[ ! "$node_version" =~ ^v([0-9]+)\.([0-9]+)\. ]]; then
          echo "::error::Node 22.12+ is required (found ${node_version})"
          exit 1
        fi
        node_major="${BASH_REMATCH[1]}"
        node_minor="${BASH_REMATCH[2]}"
        if ((node_major < 22 || (node_major == 22 && node_minor < 12))); then
          echo "::error::Node 22.12+ is required (found ${node_version})"
          exit 1
        fi
        npm ci --ignore-scripts --no-fund
        npx --no-install markdownlint-cli2 "docs/**/*.md" ".amazonq/rules/**/*.md" "todo.md" "README.md" "index.md"
        # npm 監査: ルート / e2e / client の3 lockfile を対象にする。
        # いずれも devDependency で本番ランタイムへは入らない。
        npm audit --audit-level=high
        npm audit --prefix e2e --audit-level=high
        npm audit --prefix client --audit-level=high
        bash scripts/test-doc-numbers.sh
        # cargo-deny のキャッシュ（バージョン＋checksum）。ミス時は従来の cargo install を維持。
        cargo_deny_bin="${tool_cache_dir}/cargo-deny-${cargo_deny_version}"
        cargo_deny_sum="${cargo_deny_bin}.sha256"
        cargo_deny_hit=0
        if [[ -x "$cargo_deny_bin" && -f "$cargo_deny_sum" ]] &&
           (cd "$tool_cache_dir" && sha256sum -c "$(basename "$cargo_deny_sum")" >/dev/null 2>&1); then
          cargo_deny_hit=1
        fi
        if ((cargo_deny_hit == 0)); then
          cargo install cargo-deny --version "$cargo_deny_version" --locked
          cp "$(command -v cargo-deny)" "$cargo_deny_bin"
          (cd "$tool_cache_dir" && sha256sum "$(basename "$cargo_deny_bin")" > "$(basename "$cargo_deny_sum")")
        fi
        # キャッシュヒット／ミスを問わず固定版 --version を確認する（ADR-0013 P3）。
        "$cargo_deny_bin" --version 2>&1 | grep -qF "$cargo_deny_version" || {
          echo "::error::cargo-deny version mismatch: expected ${cargo_deny_version}" >&2
          exit 1
        }
        ln -sf "$(basename "$cargo_deny_bin")" "${tool_cache_dir}/cargo-deny"
        export PATH="${tool_cache_dir}:${PATH}"
        echo "cargo-deny cache_hit=${cargo_deny_hit}"
        cargo deny check licenses
        cargo deny check advisories
        cargo deny check bans sources
        # シェル静的ゲート（既存行は維持し、以下3行を追加）。対象は glob で明示する。
        # shellcheck / shfmt は共通ワークフローの apt_packages（呼び出し側 ci.yml）で導入する。
        for f in scripts/*.sh e2e/*.sh; do bash -n "$f"; done
        # SC2034 は ci-e2e.sh の nameref 関数のみで関数単位の disable コメントとして除外する。
        # SC2016 は test-backup-rotate.sh の systemd 契約検証用リテラルのみで行単位除外する。
        for f in scripts/*.sh e2e/*.sh; do shellcheck "$f"; done
        shfmt_files="$(shfmt -l scripts/*.sh e2e/*.sh)" || exit 1; if [ -n "$shfmt_files" ]; then echo "shfmt: unformatted: $shfmt_files" >&2; exit 1; fi
        # --- systemd/cron 構文ゲート（ADR-0013 P3） --------------------------
        # deploy の unit/timer を一時ディレクトリへコピーする。OnFailure 先の .example は
        # 拡張子を落とした正式 unit 名で配置し、参照を解決可能にする。
        # Exec* の未配置パスは「テンプレート」として /bin/true へ差し替え、実在を要求しない。
        systemd_check_dir="$(mktemp -d)"
        for unit_src in deploy/*.service deploy/*.timer deploy/*.service.example; do
          [[ -f "$unit_src" ]] || continue
          unit_name="${unit_src##*/}"
          unit_name="${unit_name%.example}"
          sed -E \
            -e 's#^(Exec(Start|StartPre|StartPost|Stop|StopPost|Reload)=[+-]?)[^[:space:]].*$#\1/bin/true#' \
            -e 's#__SET_ME__#/bin/true#' \
            "$unit_src" > "${systemd_check_dir}/${unit_name}"
        done
        SYSTEMD_UNIT_PATH="${systemd_check_dir}:" systemd-analyze verify "${systemd_check_dir}"/*.service "${systemd_check_dir}"/*.timer
        rm -rf "$systemd_check_dir"
        # cron: /etc/cron.d 形式（5時刻フィールド + user + command = 7 フィールド以上）を検証し、
        # /opt/openIllustration/... で参照するリポジトリ内実行ファイルの存在も照合する。
        for cron_src in deploy/*.cron; do
          [[ -f "$cron_src" ]] || continue
          while IFS= read -r cron_line; do
            [[ -z "$cron_line" ]] && continue
            # コメントと /etc/cron.d の環境変数行（SHELL= / PATH= / MAILTO= 等）は
            # ジョブ行ではないため検査対象外。これらをジョブ行と誤判定すると
            # 自テンプレート自身が常時失敗する。
            [[ "$cron_line" =~ ^[[:space:]]*# ]] && continue
            [[ "$cron_line" =~ ^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*= ]] && continue
            field_count="$(awk '{print NF}' <<<"$cron_line")"
            if ((field_count < 7)); then
              echo "::error::${cron_src}: cron job line needs >= 7 fields, got ${field_count}: ${cron_line}" >&2
              exit 1
            fi
            read -r c_minute c_hour c_dom c_month c_dow _ <<<"$cron_line"
            # 文字種だけでなく数値範囲・Range/Step 構文も検査する（fail-closed）。
            cron_field_valid() {
              local field="$1" max="$2" min="$3" part low high step
              [[ "$field" =~ ^[0-9A-Za-z*,/-]+$ ]] || return 1
              IFS=',' read -ra parts <<<"$field"
              for part in "${parts[@]}"; do
                [[ -n "$part" ]] || return 1
                # Step: /*N 形式（N>=1）
                if [[ "$part" == *"/"* ]]; then
                  step="${part##*/}"
                  [[ "$step" =~ ^[0-9]+$ ]] && ((step >= 1)) || return 1
                  part="${part%%/*}"
                fi
                # Range: A-B / 単一値 / ワイルドカード
                if [[ "$part" == *"-"* ]]; then
                  low="${part%%-*}"
                  high="${part##*-}"
                  [[ "$low" =~ ^[0-9]+$ && "$high" =~ ^[0-9]+$ ]] || return 1
                  ((min <= low && low <= high && high <= max)) || return 1
                elif [[ "$part" == "*" ]]; then
                  :
                elif [[ "$part" =~ ^[0-9]+$ ]]; then
                  ((min <= part && part <= max)) || return 1
                else
                  return 1
                fi
              done
              return 0
            }
            if ! cron_field_valid "$c_minute" 59 0 || ! cron_field_valid "$c_hour" 23 0 ||
               ! cron_field_valid "$c_dom" 31 1 || ! cron_field_valid "$c_month" 12 1 ||
               ! cron_field_valid "$c_dow" 7 0; then
              echo "::error::${cron_src}: invalid cron field range: ${cron_line}" >&2
              exit 1
            fi
          done < <(
            # 有効ジョブ行に加え、テンプレート内でコメントアウトされたジョブ行も検証する
            # （既定無効のテンプレートでも構文回帰を検出できるようにする）。
            # cron-d-example マーカー行（root crontab 形式の例）は /etc/cron.d 検証対象外。
            grep -v 'cron-d-example' "$cron_src" |
              sed -E 's/^[[:space:]]*#[[:space:]]*//' |
              grep -E '^[0-9*][^=]+[[:space:]]/?'
          )
          while IFS= read -r referenced; do
            [[ -z "$referenced" ]] && continue
            rel_path="${referenced#/opt/openIllustration/}"
            if [[ -n "$rel_path" && ! -f "$rel_path" ]]; then
              echo "::error::${cron_src}: referenced executable '${referenced}' not found as '${rel_path}'" >&2
              exit 1
            fi
          done < <(grep -oE '/opt/openIllustration/[A-Za-z0-9_./-]+\.(sh|py|bin)' "$cron_src" | sort -u || true)
        done
        # 本番相当のダミー設定で doctor --strict を実行し、起動前設定診断をゲート化する。
        # ダミー本番値が後続のモック E2E へ漏れないようサブシェルで隔離する。
        ( source scripts/doctor-ci-env.sh && cargo run -p server --bin doctor --quiet -- --strict )
        bash scripts/test-backup-rotate.sh
        bash scripts/test-backup-cron-wrapper.sh
        bash scripts/test-prepare-distribution.sh
        bash e2e/ci-e2e.sh
