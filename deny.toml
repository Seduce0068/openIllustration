# cargo-deny 設定。CI の extra_gates では4ゲート（licenses / advisories / bans /
# sources）を実行する。依存の追加・更新時は `cargo deny check licenses` /
# `cargo deny check advisories` / `cargo deny check bans sources` で再検証する。
#
# 方針:
# - 配布物（server バイナリ、client wasm）に組み込まれる依存を対象にする。
# - AGPL-3.0-or-later と両立する許容的ライセンスのみを許可する。
# - copyleft は選択可能な場合のみ許容し、強制される場合は失敗させる。

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[licenses]
# 未使用の許可ライセンスは失敗にしない（依存更新で自然に増減するため）。
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# 脆弱性勧告の検査。既知の勧告は理由付きで許容し、新しい勧告は CI を
# 失敗させる。見直しは四半期ごと、依存更新時、本番化判断時に行う。
# 評価の詳細は docs/SECURITY_ADVISORIES.md を参照する。
#
# 受容は 10 件（脆弱性 9 件 / unmaintained 1 件）。内訳は libsql 系 8 件、
# chrono 1 件、url 1 件（paste は解消済みで ignore から削除）。
# libsql 系の受容根拠は、本番が production_database_url_error のゲートで
# リモート DSN を禁止し、`file:` 絶対パスのみ受理する（fail-closed）点にある。
[advisories]
# 依存から消えた勧告の ignore が残っていないか検査する。
unused-ignored-advisory = "deny"
ignore = [
  # libsql 0.10.0 の TLS / gRPC スタック（上流の更新待ち、8 件）
  # 本番はリモート DSN をゲートで禁止するため、下記の受容根拠はゲートに拠る。
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 は libsql/tonic 経由。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0346", reason = "rustls 0.22.4 は libsql 経由。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0349", reason = "rustls 0.22.4 は libsql 経由。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 は libsql 経由。CRL 未使用。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8 は libsql 経由。誤発行が前提。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8 は libsql 経由。誤発行が前提。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8 は libsql 経由。CRL 未使用。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 は libsql 経由。本番はリモートDSNをゲートで禁止する" },
  # 2026-11-17 発行: unmaintained（情報区分）で脆弱性ではない。修正版なし（chrono 1 件）。
  # common/age・server・libsql 経由で使用。jiff/time への移行を別途計画する。
  { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 は unmaintained 情報勧告。修正版なし。jiff/time 移行を計画中" },
  # 2026-11-22 発行: url 2.5.8 の blob: URL 再帰スタックオーバーフロー。
  # 本アプリは Url::origin() を無信頼入力へ呼ばない（leptos/reqwest 経由の間接依存）。
  { id = "RUSTSEC-2026-0592", reason = "url 2.5.8 は leptos/reqwest 経由。Url::origin() を無信頼入力へ呼ばない。上流更新待ち" },
]

# 依存の重複と取得元の検査。licenses / advisories に加えて CI の extra_gates で
# `cargo deny check bans sources` を実行し、4ゲート（licenses / advisories /
# bans / sources）を揃える。
# multiple-versions は deny。既知の複数バージョンは上流依存（libsql が axum 0.6 /
# tonic 0.11 系を推移的に要求する等）に起因するため、Cargo.lock の実バージョンを
# `version = "=<exact>"` で列挙して skip する。`version = "*"` は将来追加される
# 新規バージョンまで黙って許容し、deny にしても bans が実質無効になるため使わない。
# 新しい重複が出たときは理由を添えて skip を追加すること。
# sha256 便宜 crate は sha2+hex へ置換して削除済み。sha2 / digest の skip は
# leptos 経由で重複が残るため維持する（削除すると cargo deny が失敗するため残す）。
# wildcards = "allow" は workspace の path 依存（common / client / server）を
# wildcard と誤検知しないための設定であり、レジストリ依存の制約を緩めるものではない。
[bans]
multiple-versions = "deny"
wildcards = "allow"  # workspace の path 依存を wildcard と誤検知しないため
skip = [
