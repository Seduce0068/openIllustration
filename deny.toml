# cargo-deny 設定。ライセンス検査のみを CI で実行する。
# 依存の追加・更新時は `cargo deny check licenses` で再検証する。
#
# 方針:
# - 配布物（server バイナリ、client wasm）に組み込まれる依存を対象にする。
# - AGPL-3.0-or-later と両立する許容的ライセンスのみを許可する。
# - copyleft は選択可能な場合のみ許容し、強制される場合は失敗させる。

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[licenses]
# 未使用の許可ライセンスは失敗にしない（依存更新で自然に増減するため）。
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# 脆弱性勧告の検査。既知の勧告は理由付きで許容し、新しい勧告は CI を
# 失敗させる。見直しは四半期ごと、依存更新時、本番化判断時に行う。
# 評価の詳細は docs/SECURITY_ADVISORIES.md を参照する。
#
# 受容は 12 件（脆弱性 8 件 / unmaintained 4 件）。内訳は libsql 系 10 件、
# leptos 経由のビルド時マクロ paste 1 件、chrono 1 件。
# libsql 系の受容根拠は、本番が production_database_url_error のゲートで
# リモート DSN を禁止し、`file:` 絶対パスのみ受理する（fail-closed）点にある。
[advisories]
# 依存から消えた勧告の ignore が残っていないか検査する。
unused-ignored-advisory = "deny"
ignore = [
  # libsql 0.10.0 の TLS / gRPC スタック（上流の更新待ち、10 件）
  # 本番はリモート DSN をゲートで禁止するため、下記の受容根拠はゲートに拠る。
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 は libsql 内部依存。上流更新待ち。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 は libsql/tonic 経由。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0346", reason = "rustls 0.22.4 は libsql 経由。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0349", reason = "rustls 0.22.4 は libsql 経由。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 は libsql 経由。未保守のみ。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0049", reason = "rustls-webpki 0.102.8 は libsql 経由。CRL 未使用。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.102.8 は libsql 経由。誤発行が前提。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.102.8 は libsql 経由。誤発行が前提。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.102.8 は libsql 経由。CRL 未使用。本番はリモートDSNをゲートで禁止する" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 は libsql 経由。本番はリモートDSNをゲートで禁止する" },
  # ビルド時のみ使われるマクロ（既知の脆弱性なし、paste 1 件）
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 は leptos のビルド時マクロ。leptos 更新待ち" },
  # 2026-11-17 発行: unmaintained（情報区分）で脆弱性ではない。修正版なし（chrono 1 件）。
  # common/age・server・libsql 経由で使用。jiff/time への移行を別途計画する。
  { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 は unmaintained 情報勧告。修正版なし。jiff/time 移行を計画中" },
]

# 依存の重複と取得元の検査（licenses / advisories に加えて CI で実行）。
# 既知の複数バージョンは上流依存（libsql が axum 0.6 / tonic 0.11 系を
# 推移的に要求する等）に起因するため、理由付きで明示的に許容する。
[bans]
multiple-versions = "warn"
wildcards = "allow"  # workspace の path 依存を wildcard と誤検知しないため
# 新規の重複が出たときは理由を添えて skip を追加すること。
# sha256 便宜 crate は sha2+hex へ置換して削除済み。sha2 / digest の skip は
# leptos 経由で重複が残るため維持する（削除すると cargo deny が失敗するため残す）。
skip = [
  { name = "axum", version = "*" },
  { name = "axum-core", version = "*" },
  { name = "base64", version = "*" },
  { name = "bitflags", version = "*" },
  { name = "block-buffer", version = "*" },
  { name = "convert_case", version = "*" },
  { name = "cpufeatures", version = "*" },
  { name = "crypto-common", version = "*" },
  { name = "digest", version = "*" },
  { name = "fallible-iterator", version = "*" },
  { name = "getrandom", version = "*" },
  { name = "gloo-net", version = "*" },
  { name = "gloo-utils", version = "*" },
  { name = "h2", version = "*" },
  { name = "hashbrown", version = "*" },
  { name = "http", version = "*" },
  { name = "http-body", version = "*" },
  { name = "hyper", version = "*" },
  { name = "hyper-rustls", version = "*" },
  { name = "indexmap", version = "*" },
  { name = "itertools", version = "*" },
  { name = "matchit", version = "*" },
  { name = "openssl-probe", version = "*" },
  { name = "prettyplease", version = "*" },
  { name = "rand", version = "*" },
  { name = "rand_chacha", version = "*" },
  { name = "rand_core", version = "*" },
  { name = "rustc-hash", version = "*" },
  { name = "rustls", version = "*" },
  { name = "rustls-native-certs", version = "*" },
  { name = "rustls-webpki", version = "*" },
  { name = "sha2", version = "*" },
  { name = "shlex", version = "*" },
  { name = "socket2", version = "*" },
  { name = "syn", version = "*" },
  { name = "sync_wrapper", version = "*" },
  { name = "synstructure", version = "*" },
  { name = "thiserror", version = "*" },
  { name = "thiserror-impl", version = "*" },
  { name = "tokio-rustls", version = "*" },
  { name = "tower", version = "*" },
  { name = "tower-http", version = "*" },
  { name = "zerocopy", version = "*" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
