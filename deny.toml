# cargo-deny 設定。ライセンス検査のみを CI で実行する。
# 依存の追加・更新時は `cargo deny check licenses` で再検証する。
#
# 方針:
# - 配布物（server バイナリ、client wasm）に組み込まれる依存を対象にする。
# - AGPL-3.0-or-later と両立する許容的ライセンスのみを許可する。
# - copyleft は選択可能な場合のみ許容し、強制される場合は失敗させる。

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[licenses]
# 未使用の許可ライセンスは失敗にしない（依存更新で自然に増減するため）。
unused-allowed-license = "allow"
confidence-threshold = 0.8
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
