[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
axum = "0.8.9"
chrono = "0.4.44"
jsonwebtoken = "10.4.0"
libsql = "0.9.30"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = "1.0.228"
serde_json = "1.0.150"
sha256 = "1.6.0"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
proptest = "1.11.0"

[dev-dependencies]
tokio-test = "0.4.5"
