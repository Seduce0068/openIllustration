[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
anyhow = "1.0.95"
thiserror = "2.0.11"
async-trait = "0.1.86"
axum = { version = "0.7.9", features = ["multipart"] }
chrono = "0.4.39"
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"] }
libsql = "0.9.30"
reqwest = { version = "0.12.12", features = ["json", "multipart", "stream"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha256 = "1.6.0"
rsa = { version = "0.9.7", features = ["sha2"] }
tokio = { version = "1.43.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
proptest = "1.11.0"
x509-parser = "0.17.0"
base64 = "0.22"
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1"
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
rcgen = "0.13"
tokio-test = "0.4.5"
rsa = { version = "0.9.7", features = ["sha2"] }
rand = "0.8"
