[package]
name = "server"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
# src/bin/verify_audit_log.rs も auto-discover されるため、`cargo run` の既定を明示する。
default-run = "server"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
anyhow = "1.0.95"
thiserror = "2.0.11"
async-trait = "0.1.86"
axum = { version = "0.8", features = ["multipart"] }
chrono = "0.4.39"
jsonwebtoken = { version = "12.0", features = ["rust_crypto"] }
libsql = "0.10"
reqwest = { version = "0.13", features = ["json", "multipart", "stream", "form"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
rsa = { version = "0.10", features = ["pkcs1v15"] }
tokio = { version = "1.43.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
uuid = { version = "1.23.1", features = ["v4"] }
x509-parser = { version = "0.18", features = ["verify"] }
base64 = "0.23"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "json"] }
hex = "0.4"
sha2 = "0.11"
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.10"
coins-bip32 = "0.17"
# レート制限（GCRA）。活発・MIT・軽量な keyed インメモリ実装を採用。
governor = "0.10.4"

[dev-dependencies]
# proptest はテスト専用（fuzz_test.rs / tests.rs の property test）なので
# dev-dependencies に置く。通常依存にすると cargo の unused dependency 警告が出る。
proptest = "1.12"
rcgen = "0.14"
rsa = { version = "0.10", features = ["pkcs1v15", "getrandom"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
