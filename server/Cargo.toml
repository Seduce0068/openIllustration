[package]
name = "server"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
# src/bin/verify_audit_log.rs も auto-discover されるため、`cargo run` の既定を明示する。
default-run = "server"

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
anyhow = "1.0.95"
thiserror = { workspace = true }
async-trait = "0.1.86"
axum = { version = "0.8", features = ["multipart"] }
chrono = { workspace = true, features = ["clock", "serde"] }
jsonwebtoken = { version = "12.0", features = ["rust_crypto"] }
libsql = "0.10"
# ADR-0013 P4: default-features=false で native-tls 系を外し rustls へ統一する。
# reqwest 0.13 の rustls feature 名は `rustls`（0.11/0.12 の `rustls-tls` ではない）。
# 既存の charset / http2 / system-proxy は従来の default features から維持する。
reqwest = { workspace = true, default-features = false, features = ["rustls", "charset", "http2", "system-proxy", "json", "multipart", "form"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rsa = { workspace = true, features = ["pkcs1v15"] }
# ADR-0013 P4: "full" を外して使用 feature のみ列挙する。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }
x509-parser = { version = "0.18", features = ["verify"] }
base64 = { workspace = true }
# ADR-0013 P4: timeout はリクエスト全体のタイムアウトミドルウェアに使う。
tower-http = { workspace = true, features = ["cors", "trace", "timeout"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "time", "json"] }
hex = { workspace = true }
sha2 = { workspace = true }
k256 = { version = "0.14", features = ["ecdsa"] }
sha3 = "0.10"
coins-bip32 = "0.17"
# レート制限（GCRA）。活発・MIT・軽量な keyed インメモリ実装を採用。
governor = "0.10.4"

[dev-dependencies]
# ADR-0013 P4: tower はテストの ServiceExt でのみ使うため dev-dependency に移し、
# 必要な "util" feature だけを列挙する。
tower = { workspace = true, features = ["util"] }
# proptest はテスト専用（fuzz_test.rs / tests.rs の property test）なので
# dev-dependencies に置く。通常依存にすると cargo の unused dependency 警告が出る。
proptest = "1.12"
rcgen = "0.14"
rsa = { workspace = true, features = ["pkcs1v15", "getrandom"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
