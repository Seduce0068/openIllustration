[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
common = { path = "../common" }
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
gloo-net = { version = "0.6", features = ["http"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "File", "FileList", "FormData", "Blob", "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
jxl-oxide = "0.5.0"
image = "0.25.10"
imageproc = "0.27.0"
image-webp = "0.2.4"
pulldown-cmark = { version = "0.13.4", features = ["default"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
