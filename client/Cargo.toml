[package]
name = "client"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
# build.rs は option_env! 対象の環境変数変更を監視するだけ（生成物なし）。
build = "build.rs"

[lib]
crate-type = ["cdylib"]

# デバッグ用コンソール出力は明示的な opt-in。リリース wasm では有効にしない
# （内部 URL・リクエストデータ・スタック情報のコンソール流出を防ぐ）。
# `dep:` 構文で optional dependency の暗黙 feature を作らない。
[features]
dev-console = ["dep:console_log", "dep:console_error_panic_hook", "dep:log"]

[dependencies]
common = { path = "../common" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = { version = "0.1", optional = true }
console_log = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
gloo-net = { version = "0.7", features = ["http"] }
# client/src が直接参照する web-sys 型をすべて明示する（推移依存の feature
# unification に依存しない）。Console は console::log_1 を使う dev-console 用。
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlAnchorElement", "HtmlElement", "File", "FileList", "FormData", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData", "History", "Location", "Url", "UrlSearchParams", "Event", "KeyboardEvent", "MouseEvent", "console"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
jxl-oxide = "0.12"
pulldown-cmark = { version = "0.13.4", features = ["default"] }

# rsa 0.10 が getrandom 0.4 を要求する。
# wasm32 では wasm_js バックエンドを明示的に有効化する。
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

# client の直接依存からは除外（common が通常依存で保持するため推移的には本番 wasm へ残る）。
[dev-dependencies]
sha2 = "0.11"
hex = "0.4"

