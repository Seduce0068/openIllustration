[package]
name = "client"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
common = { path = "../common" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
gloo-net = { version = "0.7", features = ["http"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "File", "FileList", "FormData", "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
jxl-oxide = "0.12"
pulldown-cmark = { version = "0.13.4", features = ["default"] }

# rsa 0.10 と uuid が getrandom 0.4 を要求する。
# wasm32 では wasm_js バックエンドを明示的に有効化する。
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
