[package]
name = "client"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
common = { path = "../common" }
leptos = { version = "0.6", features = ["csr"] }
leptos_router = { version = "0.6", features = ["csr"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
gloo-net = { version = "0.6", features = ["http"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "File", "FileList", "FormData", "Blob"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
wasm-bindgen-test = "0.3"
