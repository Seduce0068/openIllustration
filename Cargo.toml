[workspace]
members = [
    "common",
    "server",
    "client",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-or-later"
# let chains (`if ... && let ...`) を使用するため 1.88 以上を要求。
# toolchain 指定はリポジトリに置かず、CI / ローカルいずれもこの値以上を使う。
rust-version = "1.88"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
