[workspace]
members = [
    "common",
    "server",
    "client",
]
resolver = "2"

[workspace.package]
license = "AGPL-3.0-or-later"
# edition 2024 の minimum supported Rust version。toolchain 指定はリポジトリに置かず、
# CI / ローカルいずれもこの値（1.85）以上を使う。
rust-version = "1.85"

[profile.release]
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
