[package]
name = "common"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
base64 = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
hex = "0.4"
rsa = { version = "0.10", features = ["pkcs1v15"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
